name: Deploy

# Triggers: push to main, or manual workflow_dispatch
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write # required to push the image to GitHub Container Registry (GHCR)

jobs:
  docker:
    name: Build and Push Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set lowercase image name
        id: meta
        run: echo "image=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "Build and push (shell essentials + Python + uv)"
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ============================================================
      # Optional: after pushing, pull and restart the container on a
      # self-hosted server. Before enabling, configure these repo secrets
      # under Settings -> Secrets:
      #   DEPLOY_HOST  (e.g. 1.2.3.4)
      #   DEPLOY_USER  (e.g. root)
      #   DEPLOY_KEY   (SSH private key)
      # Then change the `if: false` below to `if: true`.
