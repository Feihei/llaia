name: Deploy

# 触发：推送到 main，或手动 workflow_dispatch
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write # 推送镜像到 GitHub Container Registry (GHCR) 需要

jobs:
  docker:
    name: Build & Push Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase image name
        id: meta
        run: echo "image=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ============================================================
      # 可选：推送到自有服务器后远程拉取并重启容器。
      # 使用前请在仓库 Settings → Secrets 配置：
      #   DEPLOY_HOST  (如 1.2.3.4)
      #   DEPLOY_USER  (如 root)
      #   DEPLOY_KEY   (SSH 私钥)
      # 并把下面的 `if: false` 改为 `if: true`。
