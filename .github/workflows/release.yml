name: Release

# Triggers: push a tag starting with v, e.g. v0.1.0
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  # Tag name that triggered the release, e.g. v0.1.0. Used in artifact names.
  VERSION: ${{ github.ref_name }}

jobs:
  # Per-platform builds. Each job only builds, packages and uploads a workflow
  # artifact -- it NEVER touches the GitHub Release directly. All release
  # uploads happen exactly once in the `publish` job below, which keeps the
  # release asset set (archives + one combined sha256sums.txt) consistent even
  # when a single matrix job is re-run.
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 -- native runner
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          # Linux aarch64 -- cross-compile via cross (Docker)
          - { os: ubuntu-latest, target: aarch64-unknown-linux-gnu, use-cross: true }
          # macOS x86_64 -- cross-compile on an Apple Silicon runner.
          # macos-13 (Intel) runners queue for many hours; macos-14 (arm64)
          # builds x86_64-apple-darwin fine, and rustls removes system-TLS deps.
          - { os: macos-14, target: x86_64-apple-darwin }
          # macOS Apple Silicon
          - { os: macos-14, target: aarch64-apple-darwin }
          # Windows x86_64
          - { os: windows-latest, target: x86_64-pc-windows-msvc }

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install cross
        if: matrix.use-cross
        run: cargo install cross --locked

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.use-cross
        run: cross build --target ${{ matrix.target }} --release

      - name: Build (native)
        if: ${{ !matrix.use-cross }}
        run: cargo build --target ${{ matrix.target }} --release --locked

      # ---- Package artifact (Unix: tar.gz) ----
      - name: Prepare artifact (Unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release/llaia"
          ARCHIVE="llaia-${{ env.VERSION }}-${{ matrix.target }}.tar.gz"
          tar -czf "$ARCHIVE" -C "target/${{ matrix.target }}/release" llaia

      # ---- Package artifact (Windows: zip) ----
      - name: Prepare artifact (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          SRC="target/${{ matrix.target }}/release/llaia.exe"
          ARCHIVE="llaia-${{ env.VERSION }}-${{ matrix.target }}.zip"
          powershell -NoProfile -Command "Compress-Archive -Path '$SRC' -DestinationPath '$ARCHIVE' -Force"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: llaia-${{ env.VERSION }}-${{ matrix.target }}.*
          if-no-files-found: error
          retention-days: 3

  # Single publish point: download every build artifact, generate ONE combined
  # checksums file (standard `sha256sum -c` format) from the actual archives,
  # upload all release assets in one shot, then write the curated release note.
  # This replaces the old per-artifact `.sha256` files (release page used to
  # list one checksum file per archive) and removes the overwrite/redo hazards
  # of per-job uploads.
  publish:
    name: Publish release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v7

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # Glob is anchored to llaia-* so the file we are about to create is
      # never included in its own checksum list.
      - name: Generate combined checksums
        run: |
          cd dist
          sha256sum llaia-* > sha256sums.txt
          cat sha256sums.txt

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/llaia-*
            dist/sha256sums.txt
          fail_on_unmatched_files: true

      # Curated note read exactly once here, so the body is never duplicated.
      - name: Compose release body from markdown
        id: notes
        run: |
          FILE="docs/release-notes/${{ github.ref_name }}.md"
          if [ -f "$FILE" ]; then
            {
              echo "body<<EOF"
              cat "$FILE"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "body=No curated note found (docs/release-notes/${{ github.ref_name }}.md)" >> "$GITHUB_OUTPUT"
          fi

      - name: Update release body
        uses: softprops/action-gh-release@v3
        with:
          body: ${{ steps.notes.outputs.body }}
          update_release_body: true
