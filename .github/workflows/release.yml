name: Release

# Triggers: push a tag starting with v, e.g. v0.1.0
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 -- native runner
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          # Linux aarch64 -- cross-compile via cross (Docker)
          - { os: ubuntu-latest, target: aarch64-unknown-linux-gnu, use-cross: true }
          # macOS Intel
          - { os: macos-13, target: x86_64-apple-darwin }
          # macOS Apple Silicon
          - { os: macos-14, target: aarch64-apple-darwin }
          # Windows x86_64
          - { os: windows-latest, target: x86_64-pc-windows-msvc }

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Linux build deps
        if: matrix.os == 'ubuntu-latest' && !matrix.use-cross
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libssl-dev

      - name: Install cross
        if: matrix.use-cross
        run: cargo install cross --locked

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.use-cross
        run: cross build --target ${{ matrix.target }} --release

      - name: Build (native)
        if: ${{ !matrix.use-cross }}
        run: cargo build --target ${{ matrix.target }} --release --locked

      # ---- Package artifact (Unix) ----
      - name: Prepare artifact (Unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release/llaia"
          strip "$BIN"
          cp "$BIN" "llaia-${{ matrix.target }}"
          sha256sum "llaia-${{ matrix.target }}" > "llaia-${{ matrix.target }}.sha256"

      # ---- Package artifact (Windows) ----
      - name: Prepare artifact (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          cp "target/${{ matrix.target }}/release/llaia.exe" "llaia-${{ matrix.target }}.exe"
          sha256sum "llaia-${{ matrix.target }}.exe" > "llaia-${{ matrix.target }}.exe.sha256"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            llaia-${{ matrix.target }}*
          # Overwrite same-named assets when re-pushing a tag
          fail_on_unmatched_files: true
