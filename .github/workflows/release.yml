name: Release

# Triggers: push a tag starting with v, e.g. v0.1.0
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  # Tag name that triggered the release, e.g. v0.1.0. Used in artifact names.
  VERSION: ${{ github.ref_name }}

jobs:
  release:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 -- native runner
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          # Linux aarch64 -- cross-compile via cross (Docker)
          - { os: ubuntu-latest, target: aarch64-unknown-linux-gnu, use-cross: true }
          # macOS x86_64 -- cross-compile on an Apple Silicon runner.
          # macos-13 (Intel) runners queue for many hours; macos-14 (arm64)
          # builds x86_64-apple-darwin fine, and rustls removes system-TLS deps.
          - { os: macos-14, target: x86_64-apple-darwin }
          # macOS Apple Silicon
          - { os: macos-14, target: aarch64-apple-darwin }
          # Windows x86_64
          - { os: windows-latest, target: x86_64-pc-windows-msvc }

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install cross
        if: matrix.use-cross
        run: cargo install cross --locked

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.use-cross
        run: cross build --target ${{ matrix.target }} --release

      - name: Build (native)
        if: ${{ !matrix.use-cross }}
        run: cargo build --target ${{ matrix.target }} --release --locked

      # ---- Package artifact (Unix: tar.gz) ----
      - name: Prepare artifact (Unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release/llaia"
          strip "$BIN"
          ARCHIVE="llaia-${{ env.VERSION }}-${{ matrix.target }}.tar.gz"
          tar -czf "$ARCHIVE" -C "target/${{ matrix.target }}/release" llaia
          # macOS lacks sha256sum; fall back to shasum (present on Linux & macOS)
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"
          else
            shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"
          fi

      # ---- Package artifact (Windows: zip) ----
      - name: Prepare artifact (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          SRC="target/${{ matrix.target }}/release/llaia.exe"
          ARCHIVE="llaia-${{ env.VERSION }}-${{ matrix.target }}.zip"
          powershell -NoProfile -Command "Compress-Archive -Path '$SRC' -DestinationPath '$ARCHIVE' -Force"
          sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            llaia-${{ env.VERSION }}-${{ matrix.target }}*
          # Overwrite same-named assets when re-pushing a tag
          fail_on_unmatched_files: true
