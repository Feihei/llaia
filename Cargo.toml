[package]
name = "llaia"
version = "0.3.0"
edition = "2021"
rust-version = "1.97"

[dependencies]
tokio = { version = "1", features = ["full"] }
# native-tls → rustls: drops the system OpenSSL dependency so cross-compile
# targets (e.g. aarch64-unknown-linux-gnu via `cross`) build without a matching
# libssl-dev. default-features=false removes default-tls; charset/http2/
# system-proxy are re-added to preserve prior runtime behaviour.
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "stream", "rustls-tls", "charset", "http2", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# 结构化配置保存（PUT /api/config）时做定点合并，保留未改动段落的注释。
# 版本须与 toml 0.8 内部依赖的 toml_edit 一致（0.22.x），避免重复编译。
toml_edit = "0.22"
serde_yaml = "0.9"
rusqlite = { version = "0.31", features = ["bundled"] }
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
clap = { version = "4", features = ["derive"] }
regex = "1"
dirs = "5"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
# IANA tz database for [runtime].timezone. Already in the tree transitively via
# tokio-cron-scheduler, so promoting it to a direct dependency costs nothing.
chrono-tz = "0.10"
uuid = { version = "1", features = ["v4"] }
shellexpand = "3"
tokio-tungstenite = { version = "0.23", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
async-stream = "0.3"
sysinfo = "0.30"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
base64 = "0.22"
mime_guess = "2"
axum = { version = "0.7", features = ["ws", "macros", "multipart"] }
tower-http = { version = "0.5", features = ["fs"] }
rust-embed = "8"
rand = "0.8"
tokio-cron-scheduler = "0.15"
dotenvy = "0.15"
aes = "0.8"
md-5 = "0.10"
# default features pull in `aws-lc-rs`, which conflicts with the `ring`
# provider already selected transitively by reqwest/hyper-rustls and
# tokio-tungstenite/tokio-rustls. Having both enabled makes rustls 0.23
# unable to auto-pick a default CryptoProvider and panic on first TLS use.
# Pin to `ring` only so exactly one provider is compiled.
rustls = { version = "0.23.43", default-features = false, features = ["ring", "logging", "std", "tls12"] }
webpki-roots = "1.0.9"
lettre = { version = "0.11.23", default-features = false, features = ["tokio1-rustls-tls", "smtp-transport", "builder"] }
mailparse = "0.16.1"
async-imap = { version = "0.11", default-features = false, features = ["runtime-tokio"] }
# default features pull in `aws_lc_rs` (= rustls `aws-lc-rs`), conflicting
# with the `ring` provider selected by reqwest/hyper-rustls. Pin to `ring`
# so exactly one rustls CryptoProvider is compiled.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
# 飞书/Lark 长连接 WS 使用 protobuf 二进制帧（pbbp2.proto），运行时编解码事件帧
prost = "0.13"
# web_fetch 正文抽取：readability 取主内容（新闻/文章场景），html2text 作全页兜底。
# readability 默认 features 含 reqwest 0.11（from_url 便利方法），本仓库自带 reqwest 0.12 且
# 自己抓页面，故关掉 default-features 去掉那条冗余依赖链。
readability = { version = "0.3.0", default-features = false }
html2text = "0.17.1"
# readability::extractor::extract 需要 url::Url 入参；作为直接依赖显式引入。
url = "2"

[dev-dependencies]
mockito = "1"
tempfile = "3"
tower = { version = "0.4", features = ["util"] }

# Strip release binaries at link time via the Rust toolchain's bundled
# `llvm-strip` (multi-architecture aware). This replaces the per-platform
# `strip` shell call in release.yml, which failed on cross-compiled targets
# (e.g. aarch64-unknown-linux-gnu) because the host's GNU strip can't read
# the foreign-arch ELF.
[profile.release]
strip = true
