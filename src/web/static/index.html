<!DOCTYPE html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LLAIA (੭aᴗa)੭</title>
  <link rel="stylesheet" href="/static/vendor/codemirror/codemirror.css">
  <link rel="stylesheet" href="/static/vendor/codemirror/material-darker.css">
  <link rel="stylesheet" href="/static/theme.css">
</head>
<body>
<div id="app" x-data="llaiaApp()" x-init="init()">
  <!-- show login overlay when not authenticated -->
  <div id="login-overlay" x-show="!authed">
    <div class="login-box">
      <h2>Llaia(੭aᴗa)੭</h2>
      <input type="password" x-model="token" @keydown.enter="saveToken()" placeholder="Enter access token" :disabled="authing">
      <button @click="saveToken()" :disabled="authing" x-text="authing ? 'Verifying...' : 'Enter'"></button>
      <div class="err" x-text="authError"></div>
      <div class="hint">Configure token in config.toml under [webui], or pass via URL ?token=xxx</div>
    </div>
  </div>
  <!-- show main UI after auth -->
  <template x-if="authed">
    <div>
  <header>
    <h1>Llaia (੭aᴗa)੭</h1>
    <div class="tabs">
      <div class="tab" :class="{active: tab==='chat'}" @click="tab='chat'">Chat</div>
      <div class="tab" :class="{active: tab==='config'}" @click="switchConfig()">Config</div>
      <div class="tab" :class="{active: tab==='cron'}" @click="switchCron()">Cron</div>
      <div class="tab" :class="{active: tab==='mcp'}" @click="switchMcp()">MCP</div>
      <div class="tab" :class="{active: tab==='about'}" @click="switchAbout()">About</div>
    </div>
  </header>
  <main>
    <div id="chat-pane" class="pane" :class="{active: tab==='chat'}">
      <div class="messages" x-ref="messages">
        <template x-for="(m, i) in messages" :key="i">
          <div class="msg" :class="m.role">
            <template x-if="m.role==='user'"><div><b>User:</b> <span x-text="m.text"></span></div></template>
            <template x-if="m.role==='assistant'"><div><b>Assistant:</b> <div x-html="renderMd(m.text)"></div></div></template>
            <template x-if="m.role==='tool'"><div><b>Tool:</b> <span x-text="m.text"></span></div></template>
            <template x-if="m.role==='media'">
              <div><b>Media:</b> <img :src="'/file?path='+encodeURIComponent(m.path)+'&token='+encodeURIComponent(token)"></div>
            </template>
          </div>
        </template>
      </div>
      <div class="composer">
        <input type="file" accept="image/*" @change="onUpload($event)" multiple>
        <input type="text" x-model="inputText" @keydown.enter="send()" :disabled="busy" placeholder="Type a message...">
        <button @click="send()" :disabled="busy">Send</button>
        <button @click="stop()" :disabled="!busy">Stop</button>
        <span x-text="uploaded.map(u=>u.path).join(', ')"></span>
      </div>
    </div>

    <div id="config-pane" class="pane" :class="{active: tab==='config'}">
      <div class="sidebar">
        <div :class="{active: configSection==='runtime'}" @click="configSection='runtime'">Runtime</div>
        <div :class="{active: configSection==='log'}" @click="configSection='log'">Log</div>
        <div :class="{active: configSection==='provider'}" @click="configSection='provider'">Provider</div>
        <div :class="{active: configSection==='agent'}" @click="configSection='agent'">Agent</div>
        <div :class="{active: configSection==='channels'}" @click="configSection='channels'">Channels</div>
        <div :class="{active: configSection==='tools'}" @click="configSection='tools'">Tools</div>
        <div @click="switchMcp()">MCP ↗</div>
        <div :class="{active: configSection==='skills'}" @click="switchSkills()">Skills</div>
        <div :class="{active: configSection==='raw'}" @click="switchRaw()">Raw TOML</div>
      </div>
      <div class="content">
        <div class="config-head">&#x276F; CONFIG <span x-text="configSection"></span></div>
        <template x-if="configSection==='runtime'">
          <div>
            <div class="form-row"><label>context_threshold</label><input type="number" step="0.1" min="0" max="1" x-model.number="cfg.runtime.context_threshold"></div>
            <div class="form-row"><label>max_iterations</label><input type="number" min="1" x-model.number="cfg.runtime.max_iterations"></div>
            <button @click="saveConfig()">Save</button>
          </div>
        </template>
        <template x-if="configSection==='log'">
          <div>
            <div class="form-row"><label>level</label>
              <select x-model="cfg.log.level"><option>debug</option><option>info</option><option>warn</option><option>error</option></select>
            </div>
            <div class="form-row"><label>dir</label><input type="text" x-model="cfg.log.dir" style="width:400px"></div>
            <button @click="saveConfig()">Save</button>
          </div>
        </template>
        <template x-if="configSection==='provider'">
          <div>
            <template x-for="(p, pid) in cfg.provider" :key="pid">
              <div class="provider-card">
                <div class="card-header">
                  <h3 x-text="pid"></h3>
                  <button class="btn-delete" @click="deleteProvider(pid)">Delete</button>
                </div>
                <div class="form-row"><label>type</label><input x-model="p.type"></div>
                <div class="form-row"><label>base_url</label><input x-model="p.base_url" style="width:400px"></div>
                <div class="form-row"><label>api_key</label><input type="password" x-model="p.api_key"></div>
                <h4>Models</h4>
                <template x-for="(m, alias) in p.model" :key="alias">
                  <div class="model-row">
                    <label x-text="alias"></label>
                    <input x-model="m.model" style="width:200px" placeholder="model id">
                    <label><input type="checkbox" x-model="m.native_tool_calling"> native</label>
                    <input type="number" placeholder="ctx" x-model.number="m.context_size" style="width:80px">
                    <button class="btn-delete" @click="deleteModel(pid, alias)">×</button>
                  </div>
                </template>
                <button class="inline-add" @click="addModel(pid)">+ Add model</button>
              </div>
            </template>
            <button class="btn-add" @click="addProvider()">+ Add provider</button>
            <button @click="saveConfig()">Save</button>
          </div>
        </template>
        <template x-if="configSection==='agent'">
          <div>
            <template x-for="(a, alias) in cfg.agent" :key="alias">
              <div class="agent-card">
                <div class="card-header">
                  <h3 x-text="alias"></h3>
                  <button class="btn-delete" @click="deleteAgent(alias)" x-show="alias !== 'main'" title="main agent 不可删除">Delete</button>
                </div>
                <div class="form-row"><label>model</label><input x-model="a.model" placeholder="provider_id.model_alias"></div>
                <div class="form-row"><label>workspace</label><input x-model="a.workspace" style="width:400px"></div>
                <div class="form-row"><label>soul</label><input x-model="a.soul"></div>
                <div class="form-row"><label>user</label><input x-model="a.user"></div>
                <div class="form-row"><label>memory</label><input x-model="a.memory"></div>
                <div class="form-row"><label>delegate_timeout</label><input type="number" x-model.number="a.delegate_timeout"></div>
              </div>
            </template>
            <button class="btn-add" @click="addAgent()">+ Add agent</button>
            <button @click="saveConfig()">Save</button>
          </div>
        </template>
        <template x-if="configSection==='channels'">
          <div>
            <h3>QQ</h3>
            <div class="form-row"><label><input type="checkbox" x-model="cfg.channels.qq.enabled"> enabled</label></div>
            <div class="form-row"><label>app_id</label><input x-model="cfg.channels.qq.app_id"></div>
            <div class="form-row"><label>app_secret</label><input type="password" x-model="cfg.channels.qq.app_secret"></div>
            <div class="form-row"><label>confirm_mode</label><input x-model="cfg.channels.qq.confirm_mode"></div>
            <h3>WebUI <span class="hint">(always enabled in serve mode)</span></h3>
            <div class="form-row"><label>host</label><input x-model="cfg.webui.host"></div>
            <div class="form-row"><label>port</label><input type="number" x-model.number="cfg.webui.port"></div>
            <div class="form-row"><label>token</label><input type="password" x-model="cfg.webui.token"></div>
            <button @click="saveConfig()">Save</button>
          </div>
        </template>
        <template x-if="configSection==='tools'">
          <div>
            <h3>terminal</h3>
            <div class="form-row"><label>confirm</label><input x-model="cfg.tools.terminal.confirm"></div>
            <div class="form-row"><label>whitelist (comma separated)</label><input :value="cfg.tools.terminal.whitelist.join(',')" @input="cfg.tools.terminal.whitelist=$event.target.value.split(',')"></div>
            <h3>tavily</h3>
            <div class="form-row"><label>api_key</label><input type="password" x-model="cfg.tools.tavily.api_key"></div>
            <button @click="saveConfig()">Save</button>
          </div>
        </template>
        <template x-if="configSection==='skills'">
          <div>
            <!-- SKILL.md 编辑视图 -->
            <template x-if="skillEditing">
              <div>
                <h3 x-text="'SKILL.md — ' + skillEditing"></h3>
                <textarea x-model="skillContent" spellcheck="false" style="width:100%;height:420px;font-family:monospace"></textarea>
                <div class="cron-toolbar">
                  <button @click="saveSkillContent()">Save</button>
                  <button @click="skillEditing=null">Back</button>
                  <span class="cron-msg" x-text="skillContentMsg"></span>
                </div>
                <div class="hint">frontmatter 需含 name 与 description（YAML，用 --- 包裹）。</div>
              </div>
            </template>
            <!-- skill 列表视图 -->
            <template x-if="!skillEditing">
              <div>
                <template x-if="!skills || skills.length === 0">
                  <div class="placeholder">No skills found. Start <code>llaia serve</code>/<code>llaia chat</code> once to seed built-in examples, or create one below.</div>
                </template>
                <template x-for="s in skills" :key="s.name">
                  <div class="provider-card">
                    <div class="card-header">
                      <h3>
                        <label><input type="checkbox" :checked="s.active" @change="toggleSkill(s.name, $event.target.checked)"> <span x-text="s.name"></span></label>
                        <span class="hint" x-text="' [' + s.duration + ']'"></span>
                      </h3>
                      <div>
                        <button @click="editSkill(s.name)">Edit</button>
                        <button class="btn-delete" @click="deleteSkill(s.name)">Delete</button>
                      </div>
                    </div>
                    <div x-text="s.description"></div>
                    <div class="hint" x-text="s.path"></div>
                    <template x-if="s.tools && s.tools.length > 0">
                      <div class="hint" x-text="'suggested tools: ' + s.tools.join(', ')"></div>
                    </template>
                  </div>
                </template>
                <div class="cron-toolbar">
                  <button @click="loadSkills()">Refresh</button>
                  <button class="btn-add" @click="newSkill()">+ New skill</button>
                  <span class="cron-msg" x-text="skillMsg"></span>
                </div>
                <div class="hint">Skills 在启动时注入 system prompt，修改后需重启 <code>llaia serve</code>/<code>llaia chat</code> 生效。</div>
              </div>
            </template>
          </div>
        </template>
        <template x-if="configSection==='raw'">
          <div>
            <textarea x-ref="rawEditor" x-model="rawToml" style="width:100%;height:500px;font-family:monospace"></textarea>
            <button @click="validateRaw()">Validate</button>
            <button @click="saveRaw()">Save</button>
            <span x-text="rawMsg"></span>
          </div>
        </template>
      </div>
    </div>

    <div id="cron-pane" class="pane" :class="{active: tab==='cron'}">
      <div class="sidebar">
        <div :class="{active: cronSection==='tasks'}" @click="switchCronSection('tasks')">Tasks</div>
        <div :class="{active: cronSection==='history'}" @click="switchCronSection('history')">History</div>
        <div :class="{active: cronSection==='raw'}" @click="switchCronSection('raw')">Raw TOML</div>
      </div>
      <div class="content">
        <div class="config-head">&#x276F; CRON <span x-text="cronSection"></span></div>

        <template x-if="cronSection==='tasks'">
          <div>
            <template x-if="!cronTasks || cronTasks.length === 0">
              <div class="placeholder">No cron tasks. Edit cron.toml or run <code>llaia init</code>.</div>
            </template>
            <template x-if="cronTasks && cronTasks.length > 0">
              <table class="cron-table">
                <thead>
                  <tr><th>id</th><th>schedule</th><th>mode</th><th>channel</th><th>enabled</th><th>actions</th></tr>
                </thead>
                <tbody>
                  <template x-for="t in cronTasks" :key="t.id">
                    <tr>
                      <td x-text="t.id"></td>
                      <td x-text="t.schedule"></td>
                      <td x-text="t.mode"></td>
                      <td x-text="t.channel"></td>
                      <td x-text="t.enabled ? '✓' : '✗'"></td>
                      <td><button @click="triggerCron(t.id)">Trigger</button></td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </template>
            <div class="cron-toolbar">
              <button @click="loadCron()">Refresh</button>
              <span class="cron-msg" x-text="cronMsg"></span>
            </div>
            <div class="hint">Triggered tasks run in the background; results push to the configured channel.</div>
          </div>
        </template>

        <template x-if="cronSection==='history'">
          <div>
            <template x-if="!cronHistory || cronHistory.length === 0">
              <div class="placeholder">No cron-triggered sessions yet.</div>
            </template>
            <template x-if="cronHistory && cronHistory.length > 0">
              <table class="cron-table">
                <thead>
                  <tr><th>channel</th><th>created</th><th>last activity</th><th>tokens</th><th>state</th></tr>
                </thead>
                <tbody>
                  <template x-for="s in cronHistory" :key="s.session_uuid">
                    <tr>
                      <td x-text="s.channel"></td>
                      <td x-text="s.created_at"></td>
                      <td x-text="s.last_activity"></td>
                      <td x-text="s.token_count"></td>
                      <td x-text="s.state"></td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </template>
            <div class="cron-toolbar">
              <button @click="loadCronHistory()">Refresh</button>
            </div>
          </div>
        </template>

        <template x-if="cronSection==='raw'">
          <div>
            <textarea x-ref="cronRawEditor" x-model="cronRaw" style="width:100%;height:500px;font-family:monospace"></textarea>
            <div class="cron-toolbar">
              <button @click="saveCronRaw()">Save</button>
              <span class="cron-msg" x-text="cronRawMsg"></span>
            </div>
            <div class="hint">Saving cron.toml requires restarting <code>llaia serve</code> to take effect.</div>
          </div>
        </template>
      </div>
    </div>

    <div id="mcp-pane" class="pane" :class="{active: tab==='mcp'}">
      <div class="sidebar">
        <div :class="{active: mcpSection==='servers'}" @click="switchMcpSection('servers')">Servers</div>
        <div :class="{active: mcpSection==='raw'}" @click="switchMcpSection('raw')">Raw TOML</div>
      </div>
      <div class="content">
        <div class="config-head">&#x276F; MCP <span x-text="mcpSection"></span></div>

        <template x-if="mcpSection==='servers'">
          <div>
            <template x-if="!mcpServers || mcpServers.length === 0">
              <div class="placeholder">No MCP servers configured. Edit mcp.toml in the Raw TOML section or run <code>llaia init</code>.</div>
            </template>
            <template x-for="s in mcpServers" :key="s.id">
              <div class="provider-card">
                <div class="card-header">
                  <h3>
                    <span x-text="s.id"></span>
                    <span x-show="s.transport" x-text="' [' + s.transport + ']'"></span>
                    <span x-text="s.status === 'connected' ? ' ✓' : ' ✗'"></span>
                  </h3>
                  <button @click="testMcp(s.id)" :disabled="mcpTesting === s.id"
                          x-text="mcpTesting === s.id ? 'Testing...' : 'Test'"></button>
                </div>
                <div x-show="s.status !== 'connected'" class="err" x-text="s.error"></div>
                <template x-if="s.tools && s.tools.length > 0">
                  <table class="cron-table">
                    <thead>
                      <tr><th>tool</th><th>description</th><th>confirm</th></tr>
                    </thead>
                    <tbody>
                      <template x-for="t in s.tools" :key="t.name">
                        <tr>
                          <td x-text="t.name"></td>
                          <td x-text="t.description"></td>
                          <td x-text="t.requires_confirm ? 'required' : 'safe'"></td>
                        </tr>
                      </template>
                    </tbody>
                  </table>
                </template>
                <div x-show="s.status === 'connected' && (!s.tools || s.tools.length === 0)" class="hint">Server connected but exposes no tools.</div>
              </div>
            </template>
            <div class="cron-toolbar">
              <button @click="loadMcp()">Refresh</button>
              <span class="cron-msg" x-text="mcpMsg"></span>
            </div>
            <div class="hint">Tools are named <code>&lt;server&gt;__&lt;tool&gt;</code>. Restart <code>llaia serve</code> after editing mcp.toml.</div>
          </div>
        </template>

        <template x-if="mcpSection==='raw'">
          <div>
            <textarea x-ref="mcpRawEditor" x-model="mcpRaw" style="width:100%;height:500px;font-family:monospace"></textarea>
            <div class="cron-toolbar">
              <button @click="saveMcpRaw()">Save</button>
              <span class="cron-msg" x-text="mcpRawMsg"></span>
            </div>
            <div class="hint">Saving mcp.toml requires restarting <code>llaia serve</code> to take effect.</div>
          </div>
        </template>
      </div>
    </div>

    <div id="about-pane" class="pane" :class="{active: tab==='about'}">
      <template x-if="status">
        <dl>
          <dt>Version</dt><dd x-text="status.version"></dd>
          <dt>Build</dt><dd x-text="status.build_hash"></dd>
          <dt>Workspace</dt><dd x-text="status.workspace"></dd>
          <dt>Config</dt><dd x-text="status.config_path"></dd>
          <dt>PID</dt><dd x-text="status.pid"></dd>
          <dt>Channels</dt>
          <dd>
            <template x-for="c in status.channels" :key="c.name">
              <div x-text="(c.enabled?'✓':'✗')+' '+c.name+(c.listening?' ('+c.listening+')':'')"></div>
            </template>
          </dd>
          <dt>DB Size</dt><dd x-text="formatBytes(status.db_size_bytes)"></dd>
          <dt>Log Dir</dt><dd x-text="status.log_dir"></dd>
          <dt>Uploads</dt><dd x-text="status.uploads_count+' files'"></dd>
        </dl>
      </template>
    </div>
  </main>
    </div>
  </template>
</div>
<script src="/static/vendor/marked.min.js"></script>
<script src="/static/vendor/highlight.min.js"></script>
<script src="/static/vendor/codemirror/codemirror.js"></script>
<script src="/static/vendor/codemirror/toml.js"></script>
<script src="/static/vendor/alpine.min.js" defer></script>
<script src="/static/app.js"></script>
</body>
</html>
