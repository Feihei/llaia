<!DOCTYPE html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LLAIA (੭aᴗa)੭</title>
  <link rel="stylesheet" href="/static/vendor/codemirror/codemirror.css">
  <link rel="stylesheet" href="/static/vendor/codemirror/material-darker.css">
  <link rel="stylesheet" href="/static/theme.css">
</head>
<body>
<div id="app" x-data="llaiaApp()" x-init="init()">
  <!-- show login overlay when not authenticated -->
  <div id="login-overlay" x-show="!authed">
    <div class="login-box">
      <h2>Llaia(੭aᴗa)੭</h2>
      <input type="password" x-model="token" @keydown.enter="saveToken()" placeholder="Enter access token" :disabled="authing">
      <button @click="saveToken()" :disabled="authing" x-text="authing ? 'Verifying...' : 'Enter'"></button>
      <div class="err" x-text="authError"></div>
      <div class="hint">Configure token in config.toml under [webui], or pass via URL ?token=xxx</div>
    </div>
  </div>
  <!-- show main UI after auth -->
  <template x-if="authed">
    <div>
  <header>
    <h1>Llaia (੭aᴗa)੭</h1>
    <div class="tabs">
      <div class="tab" :class="{active: tab==='config'}" @click="switchConfig()">Config</div>
      <div class="tab" :class="{active: tab==='chat'}" @click="tab='chat'">Chat</div>
      <div class="tab" :class="{active: tab==='sessions'}" @click="switchSessions()">Sessions</div>
    </div>
  </header>
  <main>
    <div id="chat-pane" class="pane" :class="{active: tab==='chat'}">
      <div class="messages" x-ref="messages">
        <template x-for="(m, i) in messages" :key="i">
          <div class="msg" :class="m.role">
            <template x-if="m.role==='user'"><div><b>User:</b> <span x-text="m.text"></span></div></template>
            <template x-if="m.role==='assistant'"><div><b>Assistant:</b> <div x-html="renderMd(m.text)"></div></div></template>
            <template x-if="m.role==='tool'"><div><b>Tool:</b> <span x-text="m.text"></span></div></template>
            <template x-if="m.role==='media'">
              <div>
                <b>Media:</b>
                <!-- 音频（P5 T1 TTS 产物 mp3/wav/ogg/m4a）→ <audio> 播放 -->
                <template x-if="/\.(mp3|wav|ogg|m4a)$/i.test(m.path)">
                  <audio controls :src="'/file?path='+encodeURIComponent(m.path)+'&token='+encodeURIComponent(token)"></audio>
                </template>
                <!-- 图片 -->
                <template x-if="!/\.(mp3|wav|ogg|m4a)$/i.test(m.path) && /\.(jpg|jpeg|png|gif|webp|bmp)$/i.test(m.path)">
                  <img :src="'/file?path='+encodeURIComponent(m.path)+'&token='+encodeURIComponent(token)">
                </template>
                <!-- 其他文件 → 链接 -->
                <template x-if="!/\.(mp3|wav|ogg|m4a)$/i.test(m.path) && !/\.(jpg|jpeg|png|gif|webp|bmp)$/i.test(m.path)">
                  <a :href="'/file?path='+encodeURIComponent(m.path)+'&token='+encodeURIComponent(token)" target="_blank" x-text="m.path"></a>
                </template>
              </div>
            </template>
          </div>
        </template>
      </div>
      <div class="composer">
        <input type="file" accept="image/*" @change="onUpload($event)" multiple>
        <input type="text" x-model="inputText" @keydown.enter="send()" :disabled="busy" placeholder="Type a message...">
        <button @click="send()" :disabled="busy">Send</button>
        <button @click="stop()" :disabled="!busy">Stop</button>
        <span x-text="uploaded.map(u=>u.path).join(', ')"></span>
      </div>
      <!-- 规划后执行（ADR-0024）：当前会话 todo 清单只读展示 -->
      <div class="todo-panel" x-show="todos.length">
        <div class="todo-head">&#x276F; TODO <span class="todo-count" x-text="todos.length"></span></div>
        <template x-for="t in todos" :key="t.id">
          <div class="todo-item">
            <span class="todo-mark" :class="t.status" x-text="t.status === 'done' ? '✓' : (t.status === 'in_progress' ? '~' : '○')"></span>
            <span class="todo-task" :class="{done: t.status === 'done'}" x-text="t.task"></span>
          </div>
        </template>
      </div>
      <!-- ask_user（ADR-0022）：当前待回答问题只读展示 -->
      <div class="todo-panel" x-show="questions.length" style="border-left-color:#d9b34a;">
        <div class="todo-head" style="color:#d9b34a;">&#x276F; QUESTIONS <span class="todo-count" x-text="questions.length"></span></div>
        <template x-for="q in questions" :key="q.id">
          <div class="todo-item">
            <span class="todo-mark in_progress">?</span>
            <span class="todo-task" x-text="q.question"></span>
          </div>
        </template>
      </div>
      <!-- 长期目标（ADR-0021）：goal.md 状态只读展示 -->
      <div class="todo-panel" x-show="goal" style="border-left-color:#6c9eff;">
        <div class="todo-head" style="color:#6c9eff;">&#x276F; GOAL <span class="todo-count" x-text="goal ? goal.status : ''"></span></div>
        <template x-if="goal">
          <div>
            <div class="todo-item"><span class="todo-mark active">◎</span><span class="todo-task" x-text="goal.objective"></span></div>
            <div class="todo-item" x-show="goal.progress"><span class="todo-mark note">≡</span><span class="todo-task todo-progress" x-text="goal.progress"></span></div>
          </div>
        </template>
      </div>
    </div>

    <!-- 会话历史（P5 W1）：sessions.db 只读浏览 + 删除 + 导出 -->
    <div id="sessions-pane" class="pane" :class="{active: tab==='sessions'}">
      <div class="sessions-layout">
        <div class="session-list">
          <div class="config-head">&#x276F; SESSIONS <button class="inline-add" @click="loadSessions()">Refresh</button></div>
          <div class="hint">Click a session to view its message history. Delete removes it from sessions.db (does not affect the live context).</div>
          <div x-show="sessionMsg" class="err" x-text="sessionMsg"></div>
          <template x-for="s in sessions" :key="s.session_uuid">
            <div class="session-item" :class="{active: selectedSession === s.session_uuid}" @click="openSession(s.session_uuid)">
              <div class="session-item-title"><b x-text="s.channel"></b> <span class="hint" x-text="s.message_count + ' msgs'"></span></div>
              <div class="hint" x-text="fmtTime(s.last_activity)"></div>
            </div>
          </template>
          <div class="hint" x-show="sessions.length === 0">No sessions recorded yet.</div>
        </div>
        <div class="session-detail">
          <template x-if="sessionDetail">
            <div>
              <div class="config-head">&#x276F; SESSION <span class="hint" x-text="sessionDetail.session ? sessionDetail.session.session_uuid : ''"></span>
                <button class="btn-delete" @click="deleteSession(sessionDetail.session.session_uuid)">Delete</button>
                <button @click="exportSession(sessionDetail.session.session_uuid)">Export JSON</button>
              </div>
              <template x-for="m in sessionDetail.messages" :key="m.id">
                <div class="msg" :class="m.role">
                  <div><b x-text="m.role"></b> <span class="hint" x-text="fmtTime(m.created_at)"></span></div>
                  <div class="msg-content" x-text="m.content"></div>
                  <template x-if="m.tool_calls && m.tool_calls.length">
                    <details>
                      <summary x-text="m.tool_calls.length + ' tool call(s)'"></summary>
                      <template x-for="tc in m.tool_calls" :key="tc.id">
                        <div class="toolcall">
                          <b x-text="tc.tool_name"></b> <span class="hint" x-text="tc.tool_call_id"></span>
                          <pre x-text="tc.payload"></pre>
                          <template x-if="tc.outcome !== null && tc.outcome !== undefined"><pre class="toolcall-outcome" x-text="tc.outcome"></pre></template>
                        </div>
                      </template>
                    </details>
                  </template>
                </div>
              </template>
              <div class="hint" x-show="!sessionDetail.messages || sessionDetail.messages.length === 0">No messages in this session.</div>
            </div>
          </template>
          <div class="hint" x-show="!sessionDetail">Select a session on the left to view its history.</div>
        </div>
      </div>
    </div>

    <div id="config-pane" class="pane" :class="{active: tab==='config'}">
      <div class="sidebar">
        <div :class="{active: configSection==='runtime'}" @click="configSection='runtime'">Runtime</div>
        <div :class="{active: configSection==='log'}" @click="configSection='log'">Log</div>
        <div :class="{active: configSection==='provider'}" @click="configSection='provider'">Provider</div>
        <div :class="{active: configSection==='agent'}" @click="configSection='agent'">Agent</div>
        <div :class="{active: configSection==='channels'}" @click="configSection='channels'">Channels</div>
        <div :class="{active: configSection==='tools'}" @click="configSection='tools'">Tools</div>
        <div :class="{active: configSection==='cron'}" @click="switchCron()">Cron</div>
        <div :class="{active: configSection==='mcp'}" @click="switchMcp()">MCP</div>
        <div :class="{active: configSection==='skills'}" @click="switchSkills()">Skills</div>
        <div :class="{active: configSection==='raw'}" @click="switchRaw()">Raw TOML</div>
        <div :class="{active: configSection==='about'}" @click="switchAbout()">About</div>
      </div>
      <div class="content">
        <div class="config-head">&#x276F; CONFIG <span x-text="configSection"></span></div>
        <template x-if="configSection==='runtime'">
          <div>
            <div class="form-row"><label>context_threshold</label><input type="number" step="0.1" min="0" max="1" x-model.number="cfg.runtime.context_threshold"></div>
            <div class="form-row"><label>max_iterations</label><input type="number" min="1" x-model.number="cfg.runtime.max_iterations"></div>
            <div class="form-row"><label>timezone</label><input type="text" x-model="cfg.runtime.timezone" placeholder="Asia/Shanghai (IANA)"></div>
            <div class="form-row"><label>permission</label><select x-model="cfg.runtime.permission"><option value="">unset (→ default)</option><option value="default">default</option><option value="read-only">read-only</option><option value="yolo">yolo</option></select></div>
            <button @click="saveConfig()">Save</button>
          </div>
        </template>
        <template x-if="configSection==='log'">
          <div>
            <div class="form-row"><label>level</label>
              <select x-model="cfg.log.level"><option>debug</option><option>info</option><option>warn</option><option>error</option></select>
            </div>
            <div class="form-row"><label>dir</label><input type="text" x-model="cfg.log.dir" style="width:400px"></div>
            <button @click="saveConfig()">Save</button>
          </div>
        </template>
        <template x-if="configSection==='provider'">
          <div>
            <template x-for="(p, pid) in cfg.provider" :key="pid">
              <div class="provider-card">
                <div class="card-header">
                  <h3 x-text="pid"></h3>
                  <button class="btn-delete" @click="deleteProvider(pid)">Delete</button>
                </div>
                <div class="form-row"><label>type</label><input x-model="p.type"></div>
                <div class="form-row"><label>base_url</label><input x-model="p.base_url" style="width:400px"></div>
                <div class="form-row"><label>api_key</label><input type="password" x-model="p.api_key"></div>
                <!-- 模型探测（P5 W2）：向 OpenAI 兼容端点 GET /models 拉取列表，勾选后加入 Models -->
                <div class="probe-section">
                  <button type="button" class="inline-add" @click="probeModels(pid)" :disabled="probing===pid">
                    <span x-text="probing===pid ? 'Probing…' : 'Probe models'"></span>
                  </button>
                  <span class="hint" x-show="probeMsg[pid]" x-text="probeMsg[pid]"></span>
                  <div class="probe-models" x-show="probeModels[pid] && probeModels[pid].length">
                    <template x-for="m in probeModels[pid]" :key="m.id">
                      <div class="probe-model-row">
                        <label>
                          <input type="checkbox" :checked="probeChecked[pid] && probeChecked[pid][m.id]" @change="toggleProbeModel(pid, m.id)">
                          <span x-text="m.id"></span>
                        </label>
                      </div>
                    </template>
                    <button type="button" class="inline-add" @click="addProbedModels(pid)">+ Add selected to models</button>
                  </div>
                </div>
                <div class="compat-section">
                  <button type="button" class="collapse-toggle" @click="toggleCompat(pid)">
                    <span x-text="compatOpen[pid] ? '▾' : '▸'"></span> Compatibility
                    <span class="hint" x-show="p.compat">overrides set</span>
                  </button>
                  <div class="compat-body" x-show="compatOpen[pid]">
                    <div class="hint">Endpoint differences are auto-detected from base_url (ollama/llama → preset). Override only when needed.</div>
                    <template x-if="!p.compat">
                      <button type="button" class="inline-add" @click="enableCompat(pid)">+ Add compatibility overrides</button>
                    </template>
                    <template x-if="p.compat">
                      <div class="compat-fields">
                        <label class="switch"><input type="checkbox" x-model="p.compat.reasoning_to_content"> reasoning → content (fold thinking)</label>
                        <label class="switch"><input type="checkbox" x-model="p.compat.streaming_usage"> streaming usage</label>
                        <label class="switch"><input type="checkbox" x-model="p.compat.infer_finish_reason"> infer finish_reason = tool_calls</label>
                        <label class="switch"><input type="checkbox" x-model="p.compat.requires_assistant_after_tool"> assistant placeholder after tool</label>
                        <label class="switch"><input type="checkbox" x-model="p.compat.supports_developer_role"> supports developer role</label>
                        <label class="switch">max_tokens field:
                          <select x-model="p.compat.max_tokens_field">
                            <option :value="null">inherit (auto)</option>
                            <option value="max_tokens">max_tokens</option>
                            <option value="max_completion_tokens">max_completion_tokens</option>
                          </select>
                        </label>
                        <button type="button" class="btn-delete" @click="disableCompat(pid)">Remove overrides (use auto-detect)</button>
                      </div>
                    </template>
                  </div>
                </div>
                <h4>Models</h4>
                <template x-for="(m, alias) in p.model" :key="alias">
                  <div class="model-row">
                    <label x-text="alias"></label>
                    <input x-model="m.model" style="width:200px" placeholder="model id">
                    <label><input type="checkbox" x-model="m.native_tool_calling"> native</label>
                    <input type="number" placeholder="ctx" x-model.number="m.context_size" style="width:80px">
                    <button class="btn-delete" @click="deleteModel(pid, alias)">×</button>
                  </div>
                </template>
                <button class="inline-add" @click="addModel(pid)">+ Add model</button>
              </div>
            </template>
            <button class="btn-add" @click="addProvider()">+ Add provider</button>
            <button @click="saveConfig()">Save</button>
          </div>
        </template>
        <template x-if="configSection==='agent'">
          <div>
            <template x-for="(a, alias) in cfg.agent" :key="alias">
              <div class="agent-card">
                <div class="card-header">
                  <h3 x-text="alias"></h3>
                  <button class="btn-delete" @click="deleteAgent(alias)" x-show="alias !== 'main'" title="main agent 不可删除">Delete</button>
                </div>
                <div class="form-row"><label>model</label>
                  <select x-model="a.model">
                    <option value="" disabled>— select a model —</option>
                    <template x-for="ref in modelRefs()" :key="ref">
                      <option :value="ref" x-text="ref"></option>
                    </template>
                  </select>
                </div>
                <div class="form-row" style="align-items:flex-start">
                  <label>fallback</label>
                  <div style="flex:1">
                    <div class="tag-list">
                      <template x-for="(fb, i) in (a.fallback || [])" :key="fb">
                        <span class="tag">
                          <span x-text="fb"></span>
                          <button class="tag-remove" type="button" :title="'remove ' + fb" @click="removeFallback(alias, i)">×</button>
                        </span>
                      </template>
                    </div>
                    <div class="tag-add">
                      <select x-model="fallbackDraft[alias]">
                        <option value="">— add fallback model —</option>
                        <template x-for="ref in modelRefs()" :key="ref">
                          <option :value="ref" x-text="ref"
                                  :disabled="(a.fallback || []).includes(ref) || ref === a.model"></option>
                        </template>
                      </select>
                      <button type="button" @click="addFallback(alias)">+ Add</button>
                    </div>
                    <div class="hint">主模型失败时按序降级；已在列表内或与主 model 相同的条目会被禁用。</div>
                  </div>
                </div>
                <div class="form-row"><label>delegate_timeout</label><input type="number" x-model.number="a.delegate_timeout"></div>
              </div>
            </template>
            <button class="btn-add" @click="addAgent()">+ Add agent</button>
            <button @click="saveConfig()">Save</button>
          </div>
        </template>
        <template x-if="configSection==='channels'">
          <div>
            <h3>QQ</h3>
            <div class="form-row"><label><input type="checkbox" x-model="cfg.channels.qq.enabled"> enabled</label></div>
            <div class="form-row"><label>app_id</label><input x-model="cfg.channels.qq.app_id"></div>
            <div class="form-row"><label>app_secret</label><input type="password" x-model="cfg.channels.qq.app_secret"></div>
            <div class="form-row"><label>confirm_mode</label><input x-model="cfg.channels.qq.confirm_mode"></div>
            <h3>WebUI <span class="hint">(always enabled in serve mode)</span></h3>
            <div class="form-row"><label>host</label><input x-model="cfg.webui.host"></div>
            <div class="form-row"><label>port</label><input type="number" x-model.number="cfg.webui.port"></div>
            <div class="form-row"><label>token</label><input type="password" x-model="cfg.webui.token"></div>
            <button @click="saveConfig()">Save</button>
          </div>
        </template>
        <template x-if="configSection==='tools'">
          <div>
            <h3>terminal</h3>
            <div class="form-row"><label>confirm</label><input x-model="cfg.tools.terminal.confirm"></div>
            <div class="form-row"><label>whitelist (comma separated)</label><input :value="cfg.tools.terminal.whitelist.join(',')" @input="cfg.tools.terminal.whitelist=$event.target.value.split(',')"></div>
            <h3>search</h3>
            <div class="form-row"><label>provider</label><input x-model="cfg.tools.search.provider"></div>
            <div class="form-row"><label>top_k</label><input type="number" x-model="cfg.tools.search.top_k"></div>
            <h3>tavily</h3>
            <div class="form-row"><label>api_key</label><input type="password" x-model="cfg.tools.tavily.api_key"></div>
            <h3>baidu</h3>
            <div class="form-row"><label>api_key</label><input type="password" x-model="cfg.tools.baidu.api_key"></div>
            <h3>brave</h3>
            <div class="form-row"><label>api_key</label><input type="password" x-model="cfg.tools.brave.api_key"></div>
            <h3>tts <span class="hint">(P5 T1, OpenAI-compatible /audio/speech)</span></h3>
            <div class="form-row"><label>enabled</label><input type="checkbox" x-model="cfg.tools.tts.enabled"></div>
            <div class="form-row"><label>base_url</label><input x-model="cfg.tools.tts.base_url" style="width:320px"></div>
            <div class="form-row"><label>api_key</label><input type="password" x-model="cfg.tools.tts.api_key"></div>
            <div class="form-row"><label>model</label><input x-model="cfg.tools.tts.model"></div>
            <div class="form-row"><label>voice</label><input x-model="cfg.tools.tts.voice"></div>
            <button @click="saveConfig()">Save</button>
          </div>
        </template>
        <template x-if="configSection==='skills'">
          <div>
            <!-- SKILL.md 编辑视图 -->
            <template x-if="skillEditing">
              <div>
                <h3 x-text="'SKILL.md — ' + skillEditing"></h3>
                <textarea x-model="skillContent" spellcheck="false" style="width:100%;height:420px;font-family:monospace"></textarea>
                <div class="cron-toolbar">
                  <button @click="saveSkillContent()">Save</button>
                  <button @click="skillEditing=null">Back</button>
                  <span class="cron-msg" x-text="skillContentMsg"></span>
                </div>
                <div class="hint">frontmatter 需含 name 与 description（YAML，用 --- 包裹）。</div>
              </div>
            </template>
            <!-- skill 列表视图 -->
            <template x-if="!skillEditing">
              <div>
                <template x-if="!skills || skills.length === 0">
                  <div class="placeholder">No skills found. Start <code>llaia serve</code>/<code>llaia chat</code> once to seed built-in examples, or create one below.</div>
                </template>
                <template x-for="s in skills" :key="s.name">
                  <div class="provider-card">
                    <div class="card-header">
                      <h3>
                        <label><input type="checkbox" :checked="s.active" @change="toggleSkill(s.name, $event.target.checked)"> <span x-text="s.name"></span></label>
                        <span class="hint" x-text="' [' + s.duration + ']'"></span>
                      </h3>
                      <div>
                        <button @click="editSkill(s.name)">Edit</button>
                        <button class="btn-delete" @click="deleteSkill(s.name)">Delete</button>
                      </div>
                    </div>
                    <div x-text="s.description"></div>
                    <div class="hint" x-text="s.path"></div>
                    <template x-if="s.tools && s.tools.length > 0">
                      <div class="hint" x-text="'suggested tools: ' + s.tools.join(', ')"></div>
                    </template>
                  </div>
                </template>
                <div class="cron-toolbar">
                  <button @click="loadSkills()">Refresh</button>
                  <button class="btn-add" @click="newSkill()">+ New skill</button>
                  <span class="cron-msg" x-text="skillMsg"></span>
                </div>
                <div class="hint">Skills 在保存配置时会热加载进 system prompt，无需重启 serve。</div>
              </div>
            </template>
          </div>
        </template>
        <template x-if="configSection==='raw'">
          <div>
            <textarea x-ref="rawEditor" x-model="rawToml" style="width:100%;height:500px;font-family:monospace"></textarea>
            <button @click="validateRaw()">Validate</button>
            <button @click="saveRaw()">Save</button>
            <span x-text="rawMsg"></span>
          </div>
        </template>

        <template x-if="configSection==='cron'">
          <div>
            <div class="tabs subtabs">
              <div class="tab" :class="{active: cronSection==='tasks'}" @click="switchCronSection('tasks')">Tasks</div>
              <div class="tab" :class="{active: cronSection==='history'}" @click="switchCronSection('history')">History</div>
              <div class="tab" :class="{active: cronSection==='raw'}" @click="switchCronSection('raw')">Raw TOML</div>
            </div>

            <template x-if="cronSection==='tasks'">
              <div>
                <template x-if="!cronTasks || cronTasks.length === 0">
                  <div class="placeholder">No cron tasks. Edit cron.toml or run <code>llaia init</code>.</div>
                </template>
                <template x-if="cronTasks && cronTasks.length > 0">
                  <table class="cron-table">
                    <thead>
                      <tr><th>id</th><th>schedule</th><th>mode</th><th>channel</th><th>enabled</th><th>actions</th></tr>
                    </thead>
                    <tbody>
                      <template x-for="t in cronTasks" :key="t.id">
                        <tr>
                          <td x-text="t.id"></td>
                          <td x-text="t.schedule"></td>
                          <td x-text="t.mode"></td>
                          <td x-text="t.channel"></td>
                          <td x-text="t.enabled ? '✓' : '✗'"></td>
                          <td><button @click="triggerCron(t.id)">Trigger</button></td>
                        </tr>
                      </template>
                    </tbody>
                  </table>
                </template>
                <div class="cron-toolbar">
                  <button @click="loadCron()">Refresh</button>
                  <span class="cron-msg" x-text="cronMsg"></span>
                </div>
                <div class="hint">Triggered tasks run in the background; results push to the configured channel.</div>
              </div>
            </template>

            <template x-if="cronSection==='history'">
              <div>
                <template x-if="!cronHistory || cronHistory.length === 0">
                  <div class="placeholder">No cron-triggered sessions yet.</div>
                </template>
                <template x-if="cronHistory && cronHistory.length > 0">
                  <table class="cron-table">
                    <thead>
                      <tr><th>channel</th><th>created</th><th>last activity</th><th>tokens</th><th>state</th></tr>
                    </thead>
                    <tbody>
                      <template x-for="s in cronHistory" :key="s.session_uuid">
                        <tr>
                          <td x-text="s.channel"></td>
                          <td x-text="s.created_at"></td>
                          <td x-text="s.last_activity"></td>
                          <td x-text="s.token_count"></td>
                          <td x-text="s.state"></td>
                        </tr>
                      </template>
                    </tbody>
                  </table>
                </template>
                <div class="cron-toolbar">
                  <button @click="loadCronHistory()">Refresh</button>
                </div>
              </div>
            </template>

            <template x-if="cronSection==='raw'">
              <div>
                <textarea x-ref="cronRawEditor" x-model="cronRaw" style="width:100%;height:500px;font-family:monospace"></textarea>
                <div class="cron-toolbar">
                  <button @click="saveCronRaw()">Save</button>
                  <span class="cron-msg" x-text="cronRawMsg"></span>
                </div>
                <div class="hint">Saving cron.toml hot-reloads the scheduler immediately; no restart needed.</div>
              </div>
            </template>
          </div>
        </template>

        <template x-if="configSection==='mcp'">
          <div>
            <div class="tabs subtabs">
              <div class="tab" :class="{active: mcpSection==='servers'}" @click="switchMcpSection('servers')">Servers</div>
              <div class="tab" :class="{active: mcpSection==='raw'}" @click="switchMcpSection('raw')">Raw TOML</div>
            </div>

            <template x-if="mcpSection==='servers'">
              <div>
                <template x-if="!mcpServers || mcpServers.length === 0">
                  <div class="placeholder">No MCP servers configured. Edit mcp.toml in the Raw TOML section or run <code>llaia init</code>.</div>
                </template>
                <template x-for="s in mcpServers" :key="s.id">
                  <div class="provider-card">
                    <div class="card-header">
                      <h3>
                        <span x-text="s.id"></span>
                        <span x-show="s.transport" x-text="' [' + s.transport + ']'"></span>
                        <span x-text="s.status === 'connected' ? ' ✓' : ' ✗'"></span>
                      </h3>
                      <button @click="testMcp(s.id)" :disabled="mcpTesting === s.id"
                              x-text="mcpTesting === s.id ? 'Testing...' : 'Test'"></button>
                    </div>
                    <div x-show="s.status !== 'connected'" class="err" x-text="s.error"></div>
                    <template x-if="s.tools && s.tools.length > 0">
                      <table class="cron-table">
                        <thead>
                          <tr><th>tool</th><th>description</th><th>confirm</th></tr>
                        </thead>
                        <tbody>
                          <template x-for="t in s.tools" :key="t.name">
                            <tr>
                              <td x-text="t.name"></td>
                              <td x-text="t.description"></td>
                              <td x-text="t.requires_confirm ? 'required' : 'safe'"></td>
                            </tr>
                          </template>
                        </tbody>
                      </table>
                    </template>
                    <div x-show="s.status === 'connected' && (!s.tools || s.tools.length === 0)" class="hint">Server connected but exposes no tools.</div>
                  </div>
                </template>
                <div class="cron-toolbar">
                  <button @click="loadMcp()">Refresh</button>
                  <span class="cron-msg" x-text="mcpMsg"></span>
                </div>
                <div class="hint">Tools are named <code>&lt;server&gt;__&lt;tool&gt;</code>. Editing mcp.toml hot-reloads the connection; no restart needed.</div>
              </div>
            </template>

            <template x-if="mcpSection==='raw'">
              <div>
                <textarea x-ref="mcpRawEditor" x-model="mcpRaw" style="width:100%;height:500px;font-family:monospace"></textarea>
                <div class="cron-toolbar">
                  <button @click="saveMcpRaw()">Save</button>
                  <span class="cron-msg" x-text="mcpRawMsg"></span>
                </div>
                <div class="hint">Saving mcp.toml hot-reloads the MCP connection immediately; no restart needed.</div>
              </div>
            </template>
          </div>
        </template>

        <template x-if="configSection==='about'">
          <div>
            <template x-if="status">
              <dl class="about-list">
                <dt>Version</dt><dd x-text="status.version"></dd>
                <dt>Build</dt><dd x-text="status.build_hash"></dd>
                <dt>PID</dt><dd x-text="status.pid"></dd>
                <dt>DB Size</dt><dd x-text="formatBytes(status.db_size_bytes)"></dd>
                <dt>Repository</dt>
                <dd><a href="https://github.com/Feihei/llaia" target="_blank" rel="noopener">github.com/Feihei/llaia</a></dd>
              </dl>
            </template>
            <div style="margin-top:16px;">
              <button @click="restartService()" x-bind:disabled="restarting">
                <span x-show="!restarting">Restart Service</span>
                <span x-show="restarting">Restarting…</span>
              </button>
              <span class="cron-msg" x-text="restartMsg"></span>
            </div>
            <div style="margin-top:16px;">
              <button @click="shutdownService()" x-bind:disabled="shuttingDown">
                <span x-show="!shuttingDown">Stop Service</span>
                <span x-show="shuttingDown">Stopping…</span>
              </button>
              <span class="cron-msg" x-text="shutdownMsg"></span>
            </div>
          </div>
        </template>
      </div>
    </div>
  </main>
    </div>
  </template>
</div>
<script src="/static/vendor/marked.min.js"></script>
<script src="/static/vendor/highlight.min.js"></script>
<script src="/static/vendor/codemirror/codemirror.js"></script>
<script src="/static/vendor/codemirror/toml.js"></script>
<script src="/static/vendor/alpine.min.js" defer></script>
<script src="/static/app.js"></script>
</body>
</html>
