<!DOCTYPE html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>(੭aᴗa)੭ LLAIA</title>
  <link rel="stylesheet" href="/static/vendor/codemirror/codemirror.css">
  <link rel="stylesheet" href="/static/vendor/codemirror/material-darker.css">
  <link rel="stylesheet" href="/static/theme.css">
</head>
<body>
<div id="app" x-data="llaiaApp()" x-init="init()">
  <!-- show login overlay when not authenticated -->
  <div id="login-overlay" x-show="!authed">
    <div class="login-box">
      <h2>Llaia Web</h2>
      <input type="password" x-model="token" @keydown.enter="saveToken()" placeholder="Enter access token" :disabled="authing">
      <button @click="saveToken()" :disabled="authing" x-text="authing ? 'Verifying...' : 'Enter'"></button>
      <div class="err" x-text="authError"></div>
      <div class="hint">Configure token in config.toml under [channels.web], or pass via URL ?token=xxx</div>
    </div>
  </div>
  <!-- show main UI after auth -->
  <template x-if="authed">
    <div>
  <header>
    <h1>Llaia</h1>
    <div class="tabs">
      <div class="tab" :class="{active: tab==='chat'}" @click="tab='chat'">Chat</div>
      <div class="tab" :class="{active: tab==='config'}" @click="switchConfig()">Config</div>
      <div class="tab" :class="{active: tab==='about'}" @click="switchAbout()">About</div>
    </div>
    <div class="spacer"></div>
    <div class="token-area">
      Token: <input type="password" x-model="token" @keydown.enter="saveToken()" placeholder="Enter token">
      <button @click="saveToken()">Save</button>
    </div>
  </header>
  <main>
    <div id="chat-pane" class="pane" :class="{active: tab==='chat'}">
      <div class="messages" x-ref="messages">
        <template x-for="(m, i) in messages" :key="i">
          <div class="msg" :class="m.role">
            <template x-if="m.role==='user'"><div><b>User:</b> <span x-text="m.text"></span></div></template>
            <template x-if="m.role==='assistant'"><div><b>Assistant:</b> <div x-html="renderMd(m.text)"></div></div></template>
            <template x-if="m.role==='tool'"><div><b>Tool:</b> <span x-text="m.text"></span></div></template>
            <template x-if="m.role==='media'">
              <div><b>Media:</b> <img :src="'/file?path='+encodeURIComponent(m.path)+'&token='+encodeURIComponent(token)"></div>
            </template>
          </div>
        </template>
      </div>
      <div class="composer">
        <input type="file" accept="image/*" @change="onUpload($event)" multiple>
        <input type="text" x-model="inputText" @keydown.enter="send()" :disabled="busy" placeholder="Type a message...">
        <button @click="send()" :disabled="busy">Send</button>
        <button @click="stop()" :disabled="!busy">Stop</button>
        <span x-text="uploaded.map(u=>u.path).join(', ')"></span>
      </div>
    </div>

    <div id="config-pane" class="pane" :class="{active: tab==='config'}">
      <div class="sidebar">
        <div :class="{active: configSection==='runtime'}" @click="configSection='runtime'">Runtime</div>
        <div :class="{active: configSection==='log'}" @click="configSection='log'">Log</div>
        <div :class="{active: configSection==='provider'}" @click="configSection='provider'">Provider</div>
        <div :class="{active: configSection==='agent'}" @click="configSection='agent'">Agent</div>
        <div :class="{active: configSection==='channels'}" @click="configSection='channels'">Channels</div>
        <div :class="{active: configSection==='tools'}" @click="configSection='tools'">Tools</div>
        <div :class="{active: configSection==='mcp'}" @click="configSection='mcp'">MCP (WIP)</div>
        <div :class="{active: configSection==='skills'}" @click="configSection='skills'">Skills (WIP)</div>
        <div :class="{active: configSection==='raw'}" @click="switchRaw()">Raw TOML</div>
      </div>
      <div class="content">
        <div class="config-head">&#x276F; CONFIG <span x-text="configSection"></span></div>
        <template x-if="configSection==='runtime'">
          <div>
            <div class="form-row"><label>context_threshold</label><input type="number" step="0.1" min="0" max="1" x-model.number="cfg.runtime.context_threshold"></div>
            <div class="form-row"><label>max_iterations</label><input type="number" min="1" x-model.number="cfg.runtime.max_iterations"></div>
            <button @click="saveConfig()">Save</button>
          </div>
        </template>
        <template x-if="configSection==='log'">
          <div>
            <div class="form-row"><label>level</label>
              <select x-model="cfg.log.level"><option>debug</option><option>info</option><option>warn</option><option>error</option></select>
            </div>
            <div class="form-row"><label>dir</label><input type="text" x-model="cfg.log.dir" style="width:400px"></div>
            <button @click="saveConfig()">Save</button>
          </div>
        </template>
        <template x-if="configSection==='provider'">
          <div>
            <template x-for="(p, pid) in cfg.provider" :key="pid">
              <div class="provider-card">
                <div class="card-header">
                  <h3 x-text="pid"></h3>
                  <button class="btn-delete" @click="deleteProvider(pid)">Delete</button>
                </div>
                <div class="form-row"><label>type</label><input x-model="p.type"></div>
                <div class="form-row"><label>base_url</label><input x-model="p.base_url" style="width:400px"></div>
                <div class="form-row"><label>api_key</label><input type="password" x-model="p.api_key"></div>
                <h4>Models</h4>
                <template x-for="(m, alias) in p.model" :key="alias">
                  <div class="model-row">
                    <label x-text="alias"></label>
                    <input x-model="m.model" style="width:200px" placeholder="model id">
                    <label><input type="checkbox" x-model="m.native_tool_calling"> native</label>
                    <input type="number" placeholder="ctx" x-model.number="m.context_size" style="width:80px">
                    <button class="btn-delete" @click="deleteModel(pid, alias)">×</button>
                  </div>
                </template>
                <button class="inline-add" @click="addModel(pid)">+ Add model</button>
              </div>
            </template>
            <button class="btn-add" @click="addProvider()">+ Add provider</button>
            <button @click="saveConfig()">Save</button>
          </div>
        </template>
        <template x-if="configSection==='agent'">
          <div>
            <template x-for="(a, alias) in cfg.agent" :key="alias">
              <div class="agent-card">
                <div class="card-header">
                  <h3 x-text="alias"></h3>
                  <button class="btn-delete" @click="deleteAgent(alias)">Delete</button>
                </div>
                <div class="form-row"><label>model</label><input x-model="a.model" placeholder="provider_id.model_alias"></div>
                <div class="form-row"><label>workspace</label><input x-model="a.workspace" style="width:400px"></div>
                <div class="form-row"><label>soul</label><input x-model="a.soul"></div>
                <div class="form-row"><label>user</label><input x-model="a.user"></div>
                <div class="form-row"><label>memory</label><input x-model="a.memory"></div>
                <div class="form-row"><label>delegate_timeout</label><input type="number" x-model.number="a.delegate_timeout"></div>
              </div>
            </template>
            <button class="btn-add" @click="addAgent()">+ Add agent</button>
            <button @click="saveConfig()">Save</button>
          </div>
        </template>
        <template x-if="configSection==='channels'">
          <div>
            <h3>CLI</h3>
            <div class="form-row"><label><input type="checkbox" x-model="cfg.channels.cli.enabled"> enabled</label></div>
            <h3>QQ</h3>
            <div class="form-row"><label><input type="checkbox" x-model="cfg.channels.qq.enabled"> enabled</label></div>
            <div class="form-row"><label>app_id</label><input x-model="cfg.channels.qq.app_id"></div>
            <div class="form-row"><label>app_secret</label><input type="password" x-model="cfg.channels.qq.app_secret"></div>
            <div class="form-row"><label>confirm_mode</label><input x-model="cfg.channels.qq.confirm_mode"></div>
            <h3>Web</h3>
            <div class="form-row"><label><input type="checkbox" x-model="cfg.channels.web.enabled"> enabled</label></div>
            <div class="form-row"><label>host</label><input x-model="cfg.channels.web.host"></div>
            <div class="form-row"><label>port</label><input type="number" x-model.number="cfg.channels.web.port"></div>
            <div class="form-row"><label>token</label><input type="password" x-model="cfg.channels.web.token"></div>
            <button @click="saveConfig()">Save</button>
          </div>
        </template>
        <template x-if="configSection==='tools'">
          <div>
            <h3>terminal</h3>
            <div class="form-row"><label>confirm</label><input x-model="cfg.tools.terminal.confirm"></div>
            <div class="form-row"><label>whitelist (comma separated)</label><input :value="cfg.tools.terminal.whitelist.join(',')" @input="cfg.tools.terminal.whitelist=$event.target.value.split(',')"></div>
            <h3>tavily</h3>
            <div class="form-row"><label>api_key</label><input type="password" x-model="cfg.tools.tavily.api_key"></div>
            <button @click="saveConfig()">Save</button>
          </div>
        </template>
        <template x-if="configSection==='mcp'"><div class="placeholder">MCP config is under development.</div></template>
        <template x-if="configSection==='skills'"><div class="placeholder">Skills config is under development.</div></template>
        <template x-if="configSection==='raw'">
          <div>
            <textarea x-ref="rawEditor" x-model="rawToml" style="width:100%;height:500px;font-family:monospace"></textarea>
            <button @click="validateRaw()">Validate</button>
            <button @click="saveRaw()">Save</button>
            <span x-text="rawMsg"></span>
          </div>
        </template>
      </div>
    </div>

    <div id="about-pane" class="pane" :class="{active: tab==='about'}">
      <template x-if="status">
        <dl>
          <dt>Version</dt><dd x-text="status.version"></dd>
          <dt>Build</dt><dd x-text="status.build_hash"></dd>
          <dt>Workspace</dt><dd x-text="status.workspace"></dd>
          <dt>Config</dt><dd x-text="status.config_path"></dd>
          <dt>PID</dt><dd x-text="status.pid"></dd>
          <dt>Channels</dt>
          <dd>
            <template x-for="c in status.channels" :key="c.name">
              <div x-text="(c.enabled?'✓':'✗')+' '+c.name+(c.listening?' ('+c.listening+')':'')"></div>
            </template>
          </dd>
          <dt>DB Size</dt><dd x-text="formatBytes(status.db_size_bytes)"></dd>
          <dt>Log Dir</dt><dd x-text="status.log_dir"></dd>
          <dt>Uploads</dt><dd x-text="status.uploads_count+' files'"></dd>
        </dl>
      </template>
    </div>
  </main>
    </div>
  </template>
</div>
<script src="/static/vendor/marked.min.js"></script>
<script src="/static/vendor/highlight.min.js"></script>
<script src="/static/vendor/codemirror/codemirror.js"></script>
<script src="/static/vendor/codemirror/toml.js"></script>
<script src="/static/vendor/alpine.min.js" defer></script>
<script src="/static/app.js"></script>
</body>
</html>
